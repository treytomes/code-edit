name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CodeEdit.sln

      - name: Build
        run: dotnet build CodeEdit.sln --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test CodeEdit.sln --no-build --configuration Release \
            --settings coverage.runsettings \
            --results-directory coverage/results

      - name: Install ReportGenerator
        run: dotnet tool restore

      - name: Generate coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:"coverage/results/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"Html;TextSummary;Badges;Cobertura" \
            -title:"code-edit"
          cat coverage/report/Summary.txt

      - name: Enforce coverage threshold
        run: |
          LINE=$(grep "Line coverage" coverage/report/Summary.txt | grep -oP '[0-9]+(?:\.[0-9]+)?(?=%)')
          echo "Line coverage: ${LINE}%"
          if (( $(echo "$LINE < 75" | bc -l) )); then
            echo "Coverage ${LINE}% is below the 75% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report/

  publish:
    name: Publish (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish src/CodeEdit.Presentation/CodeEdit.Presentation.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output dist/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-edit-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Checkout install scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            install.ps1
            install.bat
          sparse-checkout-cone-mode: false

      - name: Package artifacts
        run: |
          cd dist
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            dir="code-edit-${rid}"
            if [ -d "$dir" ]; then
              if [[ "$rid" == win* ]]; then
                cp ../install.ps1 "$dir/"
                cp ../install.bat "$dir/"
                zip -j "code-edit-${rid}.zip" "$dir"/*
              else
                tar -czf "code-edit-${rid}.tar.gz" -C "$dir" .
              fi
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/code-edit-linux-x64.tar.gz
            dist/code-edit-osx-x64.tar.gz
            dist/code-edit-osx-arm64.tar.gz
            dist/code-edit-win-x64.zip
          generate_release_notes: true
